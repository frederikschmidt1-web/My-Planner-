<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="My Planner"><meta name="theme-color" content="#0a84ff"><title>My Planner</title><style>
:root{color-scheme:light dark;--bg:#f3f4f8;--card:white;--fg:#171820;--muted:#687080;--line:#dfe3eb;--blue:#087fff}@media(prefers-color-scheme:dark){:root{--bg:#08090c;--card:#1b1d23;--fg:#f5f6fa;--muted:#a5abbb;--line:#343845}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main,header{max-width:680px;margin:auto;padding:18px}header{padding-top:calc(20px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:30px}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px}p{line-height:1.5}.small,small{color:var(--muted);font-size:13px}main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}button,input,select,textarea{font:inherit}button{cursor:pointer;background:var(--blue);color:white;border:0;border-radius:12px;padding:12px 16px}button.alt{background:var(--bg);color:var(--blue);border:1px solid var(--line)}button.danger{color:#e34949;background:var(--bg)}button:focus-visible,a:focus-visible{outline:3px solid var(--blue)}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}nav button{flex:1;max-width:136px;background:transparent;color:var(--muted);font-size:12px;padding:6px 2px}nav button b{display:block;font-size:22px;margin-bottom:4px}nav button.active{color:var(--blue)}.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.grow{flex:1}.done{text-decoration:line-through;opacity:.6}.check{width:24px;height:24px;flex-shrink:0}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:16px 0}.week button{padding:10px 1px;background:var(--bg);color:var(--fg);font-size:12px}.week button.active{background:var(--blue);color:white}label{display:block;margin:14px 0 6px;font-size:14px}input:not([type=checkbox]),select,textarea{display:block;width:100%;padding:12px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;min-width:0}textarea{min-height:90px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}dialog{border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--fg);width:calc(100% - 24px);max-width:520px;max-height:90dvh;padding:22px}dialog::backdrop{background:#0007}form footer{display:flex;gap:10px;margin-top:22px}form footer button{flex:1}.bar{height:12px;background:var(--bg);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}a{color:var(--blue)}#notice{position:fixed;top:14px;left:10%;right:10%;background:var(--card);padding:16px;border:1px solid var(--line);border-radius:12px;z-index:50}input[type=file]{margin:10px 0}pre{white-space:pre-wrap;font:inherit}.pill{padding:5px 8px;background:var(--bg);border-radius:8px;font-size:12px}
</style></head><body><header><div><h1 id="title">Heute</h1><div class="small" id="date"></div></div><button id="add" aria-label="Neu erstellen">＋</button></header><main id="content"></main><nav aria-label="Hauptmenü"><button data-page="today"><b>☀︎</b>Heute</button><button data-page="calendar"><b>▦</b>Kalender</button><button data-page="tasks"><b>✓</b>Aufgaben</button><button data-page="ai"><b>✦</b>KI</button><button data-page="more"><b>•••</b>Mehr</button></nav><dialog id="modal"></dialog><div id="notice" hidden role="status"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},shift=(d,n)=>{d=new Date(d);d.setDate(d.getDate()+n);return d},today=()=>iso(new Date()),uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),fmt=s=>parse(s).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}),mins=t=>Number(t.slice(0,2))*60+Number(t.slice(3)),time=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const key='myplanner.single.v1', defaults=()=>({version:1,tasks:[],events:[],schedules:[]});let state=defaults(),page='today',selected=today(),weekDate=today(),mode='week';
try{const raw=localStorage.getItem(key)||localStorage.getItem('myplanner.final')||localStorage.getItem('myplanner.v2')||localStorage.getItem('myplanner.v1');if(raw){const x=JSON.parse(raw);if(!Array.isArray(x.tasks)||!Array.isArray(x.events))throw Error();state={...defaults(),...x}}}catch(e){setTimeout(()=>notify('Gespeicherte Daten konnten nicht gelesen werden. Bitte vor Änderungen prüfen.'),500)}
function notify(t){$('#notice').textContent=t;$('#notice').hidden=false;setTimeout(()=>$('#notice').hidden=true,4500)}
function save(){try{localStorage.setItem(key,JSON.stringify(state));render();return true}catch(e){notify('Speichern fehlgeschlagen! Bitte Daten exportieren.');return false}}
function kw(s){const d=parse(s),x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));return Math.ceil(((x-new Date(Date.UTC(x.getUTCFullYear(),0,1)))/86400000+1)/7)}
function school(s){const d=parse(s).getDay();return d===0||d===6?null:{title:'Schule',startTime:'07:45',endTime:d===1||d===2&&kw(s)%2?'13:30':'12:20'}}
function events(s){return state.events.filter(e=>e.date===s||e.recurrence==='weekly'&&e.date<=s&&parse(e.date).getDay()===parse(s).getDay()).sort((a,b)=>a.startTime.localeCompare(b.startTime))}
function free(s){const busy=[school(s),...events(s)].filter(Boolean).map(e=>[Math.max(480,mins(e.startTime)),Math.min(1320,mins(e.endTime))]).filter(([a,b])=>a<b).sort((a,b)=>a[0]-b[0]);let cursor=s===today()?Math.max(480,Math.ceil((new Date().getHours()*60+new Date().getMinutes())/5)*5):480,out=[];for(const[a,b]of busy){if(a-cursor>=30)out.push([cursor,a]);cursor=Math.max(cursor,b)}if(1320-cursor>=30)out.push([cursor,1320]);return out}
const open=()=>state.tasks.filter(t=>!t.done).sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
const card=(h,b)=>`<section class="card"><h2>${h}</h2>${b}</section>`,empty=t=>`<p class="small">${t}</p>`;
function taskRow(t){return `<div class="item row"><input class="check" aria-label="Aufgabe erledigt" type="checkbox" data-toggle="${esc(t.id)}" ${t.done?'checked':''}><div class="grow ${t.done?'done':''}"><strong>${esc(t.title)}</strong><div class="small">${esc(t.subject||'Allgemein')} · ${Number(t.durationMinutes)||30} Min. ${t.dueDate?'· '+fmt(t.dueDate):''}</div>${t.description?`<div class="small">${esc(t.description)}</div>`:''}</div><button class="alt" data-task="${esc(t.id)}" aria-label="Aufgabe bearbeiten">✎</button></div>`}
function eventRow(e,s){return `<div class="item row"><div class="grow"><strong>${esc(e.title)}</strong><div class="small">${e.startTime}–${e.endTime} · ${esc(e.category||'Privat')}${e.recurrence==='weekly'?' · wöchentlich':''}</div></div><button class="alt" data-event="${esc(e.id)}">✎</button></div>`}
function render(){const labels={today:'Heute',calendar:'Kalender',tasks:'Aufgaben',ai:'KI',more:'Mehr',stats:'Statistiken'};$('#title').textContent=labels[page];$('#date').textContent=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||page==='stats'&&b.dataset.page==='more'));let h='';
if(page==='today'){const s=today(),sc=school(s),tasks=state.tasks.filter(t=>t.dueDate===s&&!t.done);const upcoming=[];for(let i=0;i<14;i++){const d=iso(shift(parse(s),i));events(d).filter(e=>i>0||e.endTime>time(new Date().getHours()*60+new Date().getMinutes())).forEach(e=>upcoming.push({...e,occurrence:d}))}h=card('Schulübersicht',sc?`<strong>${sc.startTime}–${sc.endTime}</strong><p class="small">KW ${kw(s)} · ${kw(s)%2?'ungerade':'gerade'}</p>`:empty('Heute kein Schultag.'))+card('Aufgaben heute',tasks.map(taskRow).join('')||empty('Keine offenen Aufgaben für heute.'))+card('Nächste Termine',upcoming.slice(0,4).map(e=>`<div class="small">${fmt(e.occurrence)}</div>`+eventRow(e)).join('')||empty('Keine Termine in den nächsten 14 Tagen.'))+card('Wichtige Fristen',open().filter(t=>t.dueDate).slice(0,4).map(taskRow).join('')||empty('Keine offenen Fristen.'))+card('Freie Zeit heute',free(s).map(([a,b])=>`<p>${time(a)}–${time(b)}</p>`).join('')||empty('Keine freien Zeitfenster ab jetzt bis 22 Uhr.'))+card('Wetter für Kiel',empty('Nicht angebunden. Keine erfundenen Wetterdaten.')+'<a href="https://www.dwd.de/" target="_blank" rel="noopener">Wetter beim DWD öffnen</a>')}
if(page==='tasks')h=card('Offene Aufgaben',open().map(taskRow).join('')||empty('Alles erledigt.'))+`<button data-newtask>Aufgabe erstellen</button><br><br>`+card('Erledigt',state.tasks.filter(t=>t.done).map(taskRow).join('')||empty('Noch keine erledigten Aufgaben.'));
if(page==='calendar'){let start=parse(weekDate);start=shift(start,-((start.getDay()+6)%7));const ds=Array.from({length:7},(_,i)=>iso(shift(start,i)));h=card('Kalender',`<div class="row"><button class="alt" data-week="-7">‹</button><strong>KW ${kw(weekDate)}</strong><button class="alt" data-week="7">›</button></div><div class="week">${ds.map(s=>`<button data-day="${s}" class="${selected===s?'active':''}">${fmt(s).slice(0,2)}<br>${parse(s).getDate()}</button>`).join('')}</div><div class="row"><button class="alt" data-mode="day">Tag</button><button class="alt" data-mode="week">Woche</button><button class="alt" data-today>Heute</button></div>`);for(const s of mode==='day'?[selected]:ds){const sc=school(s);h+=card(fmt(s),`${sc?`<p class="pill">Schule ${sc.startTime}–${sc.endTime}</p>`:''}${events(s).map(e=>eventRow(e,s)).join('')}${state.tasks.filter(t=>t.dueDate===s).map(taskRow).join('')}<p class="small">Frei: ${free(s).map(([a,b])=>time(a)+'–'+time(b)).join(', ')||'kein Zeitfenster'}</p>`)}h+='<button data-newevent>Termin erstellen</button>'}
if(page==='ai')h=card('KI – noch nicht verbunden',`<p class="small">Kein echter KI-Chat, keine Fotoerkennung und keine automatische Sprachverarbeitung eingerichtet. Die App funktioniert ohne KI. Deine iPhone-Tastatur kann Text diktieren.</p>`)+card('Lokale Lernzeitvorschläge',`<p class="small">Regelbasierte Vorschläge, keine KI. Maximal 45 Minuten pro Block; Restzeit bleibt bei längeren Aufgaben übrig. Änderungen werden erst mit deiner Bestätigung gespeichert.</p><button id="suggest">Vorschläge berechnen</button><div id="suggestions"></div>`);
if(page==='more')h=card('Menü',`<button data-stats>Statistiken</button>`)+card('Stundenpläne',`<p class="small">Historische Versionen bleiben erhalten. Manuelle Unterrichtsstunden können als JSON eingetragen werden; Fotoerkennung ist nicht verfügbar. Der Kalender zeigt die festgelegten Schulblöcke.</p><button id="schedule">Stundenplan manuell hinzufügen</button>${state.schedules.map(s=>`<p class="small">Gültig ab ${esc(s.validFrom)} · ${s.lessons?.length||0} Stunden</p>`).join('')}`)+card('Daten',`<p class="small">Nur lokale Speicherung. Regelmäßig exportieren: Gelöschte Browserdaten sind sonst verloren.</p><button id="export">Exportieren</button> <button class="alt" id="import">Importieren</button><input id="file" hidden type="file" accept="application/json"><p><button class="danger" id="erase">Alle Planner-Daten löschen</button></p>`)+card('Installation und Grenzen',`<p class="small">Diese einzelne HTML-Datei benötigt keine zusätzlichen Dateien und funktioniert ohne externe Bibliotheken. Für die Home-Bildschirm-Installation die HTTPS-Adresse in Safari öffnen und „Teilen → Zum Home-Bildschirm“ wählen. Kein Service Worker: erneutes Offline-Starten ist nicht garantiert. Hintergrund-Erinnerungen, Widgets, Cloud-KI, Fotoerkennung und Cloud-Synchronisierung sind nicht eingerichtet.</p>`);
if(page==='stats'){const done=state.tasks.filter(t=>t.done),ontime=done.filter(t=>t.dueDate&&t.completedAt&&iso(new Date(t.completedAt))<=t.dueDate).length;h=card('Gesamte Nutzung',`<p>Erledigt: <strong>${done.length}</strong></p><p>Offen: <strong>${open().length}</strong></p><p>Rechtzeitig erledigt: <strong>${ontime}</strong></p><p class="small">„Erledigt“ ist kein bestätigter Abgabenachweis. Lernzeit unten basiert auf geschätzter Aufgabendauer, nicht auf Zeitmessung.</p>`);const totals={};done.forEach(t=>{if(!t.completedAt)return;const s=iso(new Date(t.completedAt)),y=parse(s).getFullYear(),k=y+' · KW '+kw(s);totals[k]=(totals[k]||0)+(Number(t.durationMinutes)||0)});const max=Math.max(1,...Object.values(totals));h+=card('Geschätzte Lernzeit pro Woche',Object.entries(totals).map(([w,n])=>`<p>${esc(w)} · ${n} Min.</p><div class="bar"><i style="width:${n/max*100}%"></i></div>`).join('')||empty('Noch keine erledigten Aufgaben.'))}
$('#content').innerHTML=h;bind()}
function bind(){document.querySelectorAll('[data-toggle]').forEach(b=>b.onchange=()=>{const t=state.tasks.find(t=>t.id===b.dataset.toggle);t.done=b.checked;t.completedAt=t.done?new Date().toISOString():null;save()});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>taskForm(b.dataset.task));document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>eventForm(b.dataset.event));document.querySelectorAll('[data-newtask]').forEach(b=>b.onclick=()=>taskForm());document.querySelectorAll('[data-newevent]').forEach(b=>b.onclick=()=>eventForm());document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>{weekDate=iso(shift(parse(weekDate),+b.dataset.week));selected=weekDate;render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=b.dataset.day;mode='day';render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});if($('[data-today]'))$('[data-today]').onclick=()=>{selected=weekDate=today();render()};if($('[data-stats]'))$('[data-stats]').onclick=()=>{page='stats';render()};if($('#suggest'))$('#suggest').onclick=suggest;if($('#schedule'))$('#schedule').onclick=scheduleForm;if($('#export'))$('#export').onclick=exportData;if($('#import'))$('#import').onclick=()=>$('#file').click();if($('#file'))$('#file').onchange=importData;if($('#erase'))$('#erase').onclick=()=>{if(confirm('Alle lokalen Planner-Daten unwiderruflich löschen? Vorher exportieren!')){for(const k of [key,'myplanner.v1','myplanner.v2','myplanner.final'])localStorage.removeItem(k);state=defaults();render()}}}
function dialog(title,fields,submit,remove){const d=$('#modal');d.innerHTML=`<form><h2>${title}</h2>${fields}<footer><button type="button" class="alt" id="cancel">Abbrechen</button><button>Speichern</button></footer>${remove?'<p><button type="button" class="danger" id="delete">Löschen</button></p>':''}</form>`;$('#cancel').onclick=()=>d.close();if(remove)$('#delete').onclick=()=>{if(confirm('Wirklich löschen?')){remove();save();d.close()}};d.querySelector('form').onsubmit=e=>{e.preventDefault();submit(new FormData(e.target),d)};d.showModal()}
const field=(name,label,value,type='text',extra='')=>`<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;
function taskForm(id){const t=state.tasks.find(x=>x.id===id)||{};dialog(id?'Aufgabe bearbeiten':'Neue Aufgabe',field('title','Titel',t.title||'','text','required maxlength="250"')+field('subject','Fach',t.subject||'')+`<label>Beschreibung<textarea name="description">${esc(t.description||'')}</textarea></label>`+field('dueDate','Fällig am',t.dueDate||'','date')+field('durationMinutes','Dauer in Minuten',t.durationMinutes||30,'number','min="5" max="1440" required'),(f,d)=>{const data=Object.fromEntries(f);data.durationMinutes=+data.durationMinutes;data.dueDate=data.dueDate||null;if(id)Object.assign(t,data);else state.tasks.push({...data,id:uid(),done:false,createdAt:new Date().toISOString()});if(save())d.close()},id?()=>state.tasks=state.tasks.filter(x=>x.id!==id):null)}
function eventForm(id){const t=state.events.find(x=>x.id===id)||{};dialog(id?'Termin bearbeiten / verschieben':'Neuer Termin',field('title','Titel',t.title||'','text','required')+field('date','Datum',t.date||selected,'date','required')+'<div class="cols">'+field('startTime','Beginn',t.startTime||'15:00','time','required')+field('endTime','Ende',t.endTime||'16:00','time','required')+'</div>'+`<label>Kategorie<select name="category">${['Segeltraining','Hobbys','Sport','Privat','Familie','Schule und Lernen'].map(x=>`<option ${t.category===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Wiederholung<select name="recurrence"><option value="none">Keine</option><option value="weekly" ${t.recurrence==='weekly'?'selected':''}>Wöchentlich</option></select></label><p class="small">Bei wiederkehrenden Terminen gelten Änderungen für die gesamte Serie.</p>`,(f,d)=>{const data=Object.fromEntries(f);if(data.endTime<=data.startTime)return notify('Ende muss nach Beginn liegen.');const busy=[school(data.date),...events(data.date).filter(e=>e.id!==id)].filter(Boolean);if(busy.some(e=>data.startTime<e.endTime&&e.startTime<data.endTime)&&!confirm('Dieser Termin überschneidet sich mit Schule oder einem Termin. Trotzdem speichern?'))return;if(id)Object.assign(t,data);else state.events.push({...data,id:uid()});if(save())d.close()},id?()=>state.events=state.events.filter(x=>x.id!==id):null)}
function exportData(){const u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='my-planner-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function importData(e){try{const file=e.target.files[0];if(!file)return;const x=JSON.parse(await file.text());if(!x||!Array.isArray(x.tasks)||!Array.isArray(x.events)||x.tasks.some(t=>!t.id||typeof t.title!=='string'||t.dueDate&&!/^\d{4}-\d{2}-\d{2}$/.test(t.dueDate))||x.events.some(t=>!t.id||typeof t.title!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||!/^\d{2}:\d{2}$/.test(t.startTime)||!/^\d{2}:\d{2}$/.test(t.endTime)))throw Error();if(confirm('Import ersetzt deine aktuellen Daten. Fortfahren?')){state={...defaults(),...x};save()}}catch(e){notify('Import ungültig. Bestehende Daten wurden nicht ersetzt.')}}
function scheduleForm(){dialog('Stundenplan manuell',field('validFrom','Gültig ab',today(),'date','required')+`<label>Unterricht als JSON<textarea name="lessons" required>[{"day":1,"subject":"Mathematik","startTime":"07:45","endTime":"08:30","parity":"all"}]</textarea></label><p class="small">day: 1–5. parity: all, even oder odd. Keine LRS- oder Chor-Stunden. Historie bleibt erhalten. Die Schulblockzeiten bleiben wie vorgegeben.</p>`,(f,d)=>{try{const lessons=JSON.parse(f.get('lessons'));if(!Array.isArray(lessons)||!lessons.length||lessons.some(l=>![1,2,3,4,5].includes(l.day)||!l.subject||/lrs|chor/i.test(l.subject)||!['all','even','odd'].includes(l.parity)||!/^\d{2}:\d{2}$/.test(l.startTime)||!/^\d{2}:\d{2}$/.test(l.endTime)||l.endTime<=l.startTime))throw Error();if(!confirm('Stundenplan ab diesem Datum speichern? Private Termine und Aufgaben bleiben unverändert.'))return;state.schedules.push({id:uid(),validFrom:f.get('validFrom'),lessons});if(save())d.close()}catch(e){notify('Bitte gültige Unterrichtsdaten eintragen.')}})}
function suggest(){let reservations={};const proposals=[];for(const t of open()){if(state.events.some(e=>e.taskId===t.id&&e.date>=today()))continue;const n=Math.min(45,Math.max(5,Number(t.durationMinutes)||30));for(let i=0;i<14;i++){const s=iso(shift(parse(today()),i));if(t.dueDate&&s>t.dueDate)break;let slots=reservations[s]||free(s).map(x=>x.slice());reservations[s]=slots;const slot=slots.find(([a,b])=>b-a>=n);if(slot){const a=slot[0];proposals.push({task:t,date:s,startTime:time(a),endTime:time(a+n)});slot[0]+=n;break}}}$('#suggestions').innerHTML=proposals.map((p,i)=>`<div class="item"><strong>${esc(p.task.title)}</strong><p class="small">${fmt(p.date)} · ${p.startTime}–${p.endTime}</p><button data-plan="${i}">Bestätigen</button></div>`).join('')||empty('Keine passenden Vorschläge.');document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{const p=proposals[+b.dataset.plan];state.events.push({id:uid(),title:'Lernen: '+p.task.title,date:p.date,startTime:p.startTime,endTime:p.endTime,category:'Schule und Lernen',recurrence:'none',taskId:p.task.id});save();suggest()})}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();scrollTo(0,0)});$('#add').onclick=()=>{dialog('Neu erstellen','<p>Was möchtest du anlegen?</p><button type="button" id="choose-task">Aufgabe</button> <button type="button" id="choose-event">Termin</button>',(f,d)=>d.close());$('#choose-task').onclick=()=>{$('#modal').close();taskForm()};$('#choose-event').onclick=()=>{$('#modal').close();eventForm()}};render();
</script></body></html>
